actions:
  - name: "Bazel warm runner and cache replay"
    triggers:
      push:
        branches:
          - "bazel-buildbuddy-demo"
    container_image: "ubuntu-22.04"
    steps:
      - run: >-
          bazel build //bazel/stages:bootstrap_manifest //bazel/buildbuddy_demo:hello
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --spawn_strategy=local
      - run: >-
          bazel build //bazel/stages:bootstrap_manifest //bazel/buildbuddy_demo:hello
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --spawn_strategy=local
  - name: "Bazel RBE action and hot replay"
    triggers:
      push:
        branches:
          - "bazel-buildbuddy-demo"
    container_image: "ubuntu-22.04"
    steps:
      - run: >-
          bazel build //bazel/buildbuddy_demo:hello
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --remote_exec_header=x-buildbuddy-platform.Pool=linux-amd64-kvm
          --remote_exec_header=x-buildbuddy-platform.use-self-hosted-executors=true
          --spawn_strategy=remote
          --remote_local_fallback=false
          --remote_accept_cached=false
      - run: >-
          bazel build //bazel/buildbuddy_demo:hello
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --remote_exec_header=x-buildbuddy-platform.Pool=linux-amd64-kvm
          --remote_exec_header=x-buildbuddy-platform.use-self-hosted-executors=true
          --spawn_strategy=remote
          --remote_local_fallback=false
  - name: "PHP 8.5 release tracer RBE"
    triggers:
      push:
        branches:
          - "bazel-buildbuddy-demo"
    container_image: "ubuntu-22.04"
    resource_requests:
      cpu: 4
      memory: "12GB"
      disk: "40GB"
    platform_properties:
      remote-snapshot-save-policy: first-non-default-ref
      snapshot-read-policy: newest
    env:
      GIT_REPO_DEFAULT_BRANCH: master
    timeout: "2h"
    steps:
      - run: >-
          bazel build
          //bazel/products/tracer:ddtrace_fat_amd64_glibc_release_php85
          //bazel/products/tracer:ddtrace_fat_amd64_glibc_release_php85_check
          --config=remote-hermetic-amd64
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --remote_instance_name=
          --remote_exec_header=x-buildbuddy-platform.Pool=linux-amd64-kvm
          --remote_exec_header=x-buildbuddy-platform.use-self-hosted-executors=true
          --remote_local_fallback=false
          --remote_download_outputs=toplevel
          --jobs=8
      - run: >-
          bazel build
          //bazel/products/tracer:ddtrace_fat_amd64_glibc_release_php85
          //bazel/products/tracer:ddtrace_fat_amd64_glibc_release_php85_check
          --config=remote-hermetic-amd64
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --remote_instance_name=
          --remote_exec_header=x-buildbuddy-platform.Pool=linux-amd64-kvm
          --remote_exec_header=x-buildbuddy-platform.use-self-hosted-executors=true
          --remote_local_fallback=false
          --remote_download_outputs=toplevel
          --jobs=8
  - name: "Full tracer matrix RBE"
    triggers:
      push:
        branches:
          - "bazel-buildbuddy-matrix-demo"
    container_image: "ubuntu-22.04"
    resource_requests:
      cpu: 8
      memory: "16GB"
      disk: "80GB"
    platform_properties:
      remote-snapshot-save-policy: first-non-default-ref
      snapshot-read-policy: newest
    env:
      GIT_REPO_DEFAULT_BRANCH: master
    timeout: "6h"
    steps:
      - run: >-
          bazel build
          //bazel/products/tracer:ddtrace_fat_all
          //bazel/php:product_matrix
          //:rust_datadog_php_shared_amd64_glibc
          //:rust_datadog_php_shared_amd64_musl
          //:rust_datadog_php_shared_arm64_glibc
          //:rust_datadog_php_shared_arm64_musl
          --config=remote-hermetic-amd64
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --remote_instance_name=
          --remote_exec_header=x-buildbuddy-platform.Pool=linux-amd64-kvm
          --remote_exec_header=x-buildbuddy-platform.use-self-hosted-executors=true
          --remote_local_fallback=false
          --remote_download_outputs=toplevel
          --jobs=25
      - run: >-
          bazel build
          //bazel/products/tracer:ddtrace_fat_all
          //bazel/php:product_matrix
          //:rust_datadog_php_shared_amd64_glibc
          //:rust_datadog_php_shared_amd64_musl
          //:rust_datadog_php_shared_arm64_glibc
          //:rust_datadog_php_shared_arm64_musl
          --config=remote-hermetic-amd64
          --remote_executor=grpcs://remote.buildbuddy.io
          --remote_cache=grpcs://remote.buildbuddy.io
          --remote_instance_name=
          --remote_exec_header=x-buildbuddy-platform.Pool=linux-amd64-kvm
          --remote_exec_header=x-buildbuddy-platform.use-self-hosted-executors=true
          --remote_local_fallback=false
          --remote_download_outputs=toplevel
          --jobs=25
